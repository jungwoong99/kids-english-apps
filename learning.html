<style>
/* ============ 기본 토큰 ============ */
:root{
  --ink:#3A3550;
  --ink-soft:#7E7695;
  --line:#F1E8F6;
  --pink:#FF8FB1;
  --pink-d:#E4698F;
  --orange:#FF9F45;
  --yellow:#FFC94A;
  --green:#6FD3A6;
  --blue:#6FC1F0;
  --purple:#B79CFF;
  --card:#FFFFFF;
  --shadow:0 4px 0 rgba(140,130,170,.10), 0 12px 26px rgba(122,115,145,.14);
  --shadow-s:0 3px 0 rgba(140,130,170,.12), 0 6px 14px rgba(122,115,145,.10);
  --r-xl:30px;
  --r-lg:24px;
  --r-md:18px;
  --touch:56px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  color:var(--ink);
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(900px 620px at 6% -8%, #FFE7C2 0%, rgba(255,231,194,0) 62%),
    radial-gradient(760px 540px at 102% -4%, #D8F0FF 0%, rgba(216,240,255,0) 58%),
    radial-gradient(700px 700px at 50% 108%, #E7FBEF 0%, rgba(231,251,239,0) 60%),
    linear-gradient(172deg,#FFF7E7 0%,#FFEDF5 46%,#E9F7FF 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
  user-select:none;
  -webkit-user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
h2,h3{margin:0}
:focus-visible{outline:3px solid #8FC7FF;outline-offset:3px}

.app{
  max-width:920px;
  margin:0 auto;
  min-height:100dvh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
  display:flex;
  flex-direction:column;
}

/* ============ 상단 바 ============ */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:8px;
  padding:10px 14px 8px;
  background:linear-gradient(180deg,rgba(255,252,245,.96) 62%,rgba(255,252,245,0));
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.brand{
  display:flex;align-items:center;gap:7px;
  font-weight:900;font-size:clamp(14px,3.9vw,18px);letter-spacing:-.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-ball{
  width:22px;height:22px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(#FF6B7A 0 46%,#fff 46% 54%,#F5F5F5 54%);
  border:2.5px solid #2f2b3a;position:relative;
}
.brand-ball::after{
  content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;
  background:#fff;border:2px solid #2f2b3a;
}
.stats{margin-left:auto;display:flex;align-items:center;gap:6px}
.star-chip{
  display:flex;align-items:center;gap:4px;
  background:#fff;border-radius:999px;padding:7px 12px 7px 9px;
  box-shadow:var(--shadow-s);font-weight:900;font-size:15px;
  min-height:38px;
}
.star-chip .s{font-size:15px;line-height:1}
.star-chip.bump{animation:chipBump .5s ease}
@keyframes chipBump{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(-3deg)}70%{transform:scale(.97)}100%{transform:scale(1)}}
.round-btn{
  width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:var(--shadow-s);
  display:grid;place-items:center;font-size:18px;line-height:1;
  transition:transform .12s;
}
.round-btn:active{transform:scale(.9)}

/* ============ 파트너 ============ */
.partner{
  display:flex;align-items:center;gap:10px;
  margin:2px 14px 9px;padding:8px 10px 8px 8px;
  background:linear-gradient(135deg,#fff 0%,#FFF9EE 100%);
  border-radius:var(--r-lg);box-shadow:var(--shadow-s);
}
.partner-avatar{
  width:62px;height:62px;flex:0 0 auto;border-radius:50%;
  background:radial-gradient(circle at 50% 62%,#FFF6D4,#FFE7A6);
  display:grid;place-items:center;overflow:hidden;
  box-shadow:inset 0 0 0 3px #fff;
}
.partner-avatar svg{width:54px;height:54px;display:block}
.partner-avatar.happy{animation:pokeBounce .65s cubic-bezier(.34,1.56,.64,1)}
.partner-avatar.sad{animation:pokeTilt .6s ease}
@keyframes pokeBounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-9px) scale(1.08)}55%{transform:translateY(0) scale(.97)}75%{transform:translateY(-4px) scale(1.03)}100%{transform:translateY(0) scale(1)}}
@keyframes pokeTilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
.partner-copy{flex:1 1 auto;min-width:0}
.partner-name{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:2px}
.bubble{
  position:relative;
  display:inline-block;max-width:100%;
  background:#FFF3D9;color:#7A5A22;
  font-size:12.5px;font-weight:800;line-height:1.3;
  padding:7px 11px;border-radius:14px;
  word-break:keep-all;
}
.bubble.pop{animation:bubblePop .42s ease}
@keyframes bubblePop{0%{transform:scale(.86);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.ghost-btn{
  flex:0 0 auto;min-height:40px;padding:0 12px;border-radius:14px;
  background:#F3EEFF;color:#6E5DB8;font-weight:900;font-size:12px;
  box-shadow:inset 0 -2px 0 rgba(110,93,184,.12);
}
.ghost-btn:active{transform:scale(.95)}

/* ============ 탭 ============ */
.tabs{
  display:flex;gap:5px;padding:2px 10px 10px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  position:sticky;top:54px;z-index:25;
  justify-content:center;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 1 0;min-width:52px;max-width:170px;min-height:50px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border-radius:16px;background:#fff;color:var(--ink-soft);
  font-weight:900;font-size:11px;letter-spacing:-.3px;
  box-shadow:var(--shadow-s);
  transition:transform .12s,background .2s,color .2s;
}
.tab .ti{font-size:16px;line-height:1.15}
.tab:active{transform:scale(.94)}
.tab[aria-selected="true"]{
  color:#fff;
  background:linear-gradient(160deg,#FF9F6E,#FF7FA6);
  box-shadow:0 4px 0 #E4698F, 0 8px 16px rgba(228,105,143,.28);
}

/* ============ 패널 공통 ============ */
main{flex:1 1 auto}
.panel{display:none;padding:0 12px 18px}
.panel.active{display:block;animation:panelIn .26s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:baseline;gap:8px;margin:10px 4px 8px}
.sec-head h2{font-size:15px;font-weight:900;letter-spacing:-.4px}
.sec-head .chip{
  font-size:11px;font-weight:900;color:#A0862F;background:#FFF4D0;
  padding:3px 8px;border-radius:999px;
}
.sec-head .tip{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink-soft)}

.grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.grid.words{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.grid.dex{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}

/* 글자 카드 */
.card{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-height:100px;padding:8px 4px;
  background:var(--card);border-radius:var(--r-md);
  box-shadow:var(--shadow-s);
  transition:transform .12s,box-shadow .12s;
  overflow:hidden;
}
.card::after{
  content:"";position:absolute;inset:auto -30% -60% -30%;height:70%;
  background:radial-gradient(circle at 50% 0,rgba(255,201,74,.18),rgba(255,201,74,0) 70%);
  pointer-events:none;
}
.card:active{transform:scale(.93);box-shadow:0 1px 0 rgba(140,130,170,.12)}
.card .glyph{font-size:clamp(30px,8.4vw,42px);font-weight:900;line-height:1.05;letter-spacing:-1px}
.card .glyph.sm{font-size:clamp(24px,6.6vw,32px);letter-spacing:-1px}
.card .glyph.sm b{font-size:1.12em}
.card .emoji{font-size:clamp(22px,5.6vw,27px);line-height:1.1}
.card .lbl{font-size:11.5px;font-weight:800;color:var(--ink-soft);letter-spacing:-.3px}
.card.c-ko .glyph{color:#3A3550}
.card.c-en .glyph{color:#2F6FB0}

/* 낱말 카드 */
.wcard{
  display:flex;flex-direction:column;gap:6px;
  background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-s);
  padding:8px 8px 9px;
  min-height:150px;
}
.wcard-main{
  flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:var(--r-md);padding:6px 4px;min-height:92px;
  transition:transform .12s;
}
.wcard-main:active{transform:scale(.95)}
.wcard .emoji{font-size:clamp(36px,9vw,46px);line-height:1.05}
.wcard .ko{font-size:16px;font-weight:900;letter-spacing:-.4px}
.wcard .en{font-size:12px;font-weight:800;color:#8B83A8}
.wcard .row{display:flex;gap:5px}
.mini{
  flex:1 1 0;min-height:40px;border-radius:13px;
  font-size:11.5px;font-weight:900;letter-spacing:-.3px;
  display:flex;align-items:center;justify-content:center;gap:3px;
}
.mini.ko{background:#FFF1D6;color:#A96D1C}
.mini.en{background:#E6F3FF;color:#2F6FB0}
.mini:active{transform:scale(.94)}

/* 도감 */
.dex-card{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px 10px;border-radius:var(--r-md);
  background:var(--card);box-shadow:var(--shadow-s);
  transition:transform .12s;
}
.dex-card:active{transform:scale(.93)}
.dex-art{width:100%;aspect-ratio:1;max-height:86px;display:grid;place-items:center}
.dex-art svg{width:100%;height:100%;display:block}
.dex-card .ko{font-size:12px;font-weight:900;letter-spacing:-.4px}
.dex-card .en{font-size:10px;font-weight:800;color:#8B83A8}
.dex-card.locked{background:linear-gradient(150deg,#F6F3FA,#EFEBF7)}
.dex-card.locked .dex-art svg{filter:brightness(0) opacity(.16)}
.dex-card.locked .ko{color:#A9A2BC}
.dex-card.locked .en{color:#C0B9D0}
.dex-card.shine{animation:dexShine 1.1s ease}
@keyframes dexShine{0%{box-shadow:0 0 0 0 rgba(255,201,74,.9)}100%{box-shadow:0 0 0 18px rgba(255,201,74,0)}}
.dex-top{
  display:flex;align-items:center;gap:8px;margin:10px 4px 10px;
  background:linear-gradient(135deg,#FFF6E0,#FFE9F4);
  padding:12px 14px;border-radius:var(--r-lg);box-shadow:var(--shadow-s);
}
.dex-top .big{font-size:26px}
.dex-top .txt{flex:1 1 auto;min-width:0}
.dex-top .t1{font-size:13px;font-weight:900}
.dex-top .t2{font-size:11px;font-weight:800;color:var(--ink-soft);margin-top:2px}
.dex-bar{height:9px;border-radius:99px;background:#fff;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08);margin-top:7px}
.dex-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFC94A,#FF9F6E);transition:width .5s ease}

/* ============ 퀴즈 ============ */
.quiz-top{display:flex;align-items:center;gap:8px;margin:10px 0 10px;flex-wrap:wrap}
.mode-switch{display:flex;gap:6px;background:#fff;border-radius:999px;padding:4px;box-shadow:var(--shadow-s)}
.mode{
  min-height:40px;padding:0 14px;border-radius:999px;
  font-size:12px;font-weight:900;color:var(--ink-soft);
  display:flex;align-items:center;gap:4px;
}
.mode.on{color:#fff;background:linear-gradient(160deg,#7ED3A8,#4FB98A);box-shadow:0 3px 0 #3E9C72}
.quiz-score{
  margin-left:auto;background:#fff;border-radius:999px;padding:9px 14px;
  font-weight:900;font-size:13px;box-shadow:var(--shadow-s);
}
.prompt{
  position:relative;
  background:linear-gradient(150deg,#FFF8E6,#FFEFF7);
  border-radius:var(--r-xl);padding:14px 14px 13px;
  box-shadow:var(--shadow);text-align:center;
  margin-bottom:10px;
}
.prompt-text{font-size:clamp(16px,4.6vw,20px);font-weight:900;letter-spacing:-.5px}
.prompt-hint{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:3px}
.listen-btn{
  margin-top:10px;min-height:52px;padding:0 22px;border-radius:18px;
  background:linear-gradient(160deg,#FFD54F,#FFB43D);color:#6B4500;
  font-size:15px;font-weight:900;letter-spacing:-.3px;
  box-shadow:0 4px 0 #E39A20,0 8px 16px rgba(227,154,32,.25);
  display:inline-flex;align-items:center;gap:6px;
}
.listen-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E39A20}
.listen-btn.playing{animation:listenPulse .9s ease infinite}
@keyframes listenPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.ball-progress{
  display:flex;align-items:center;justify-content:center;gap:7px;
  margin:2px 0 12px;font-size:11px;font-weight:900;color:var(--ink-soft);
}
.ball-progress .dot{
  width:13px;height:13px;border-radius:50%;
  background:#fff;box-shadow:inset 0 0 0 2px #E6DDF2;
  transition:transform .2s,background .2s;
}
.ball-progress .dot.on{
  background:radial-gradient(circle at 40% 35%,#FFD54F,#FFB43D);
  box-shadow:inset 0 0 0 2px #E39A20;transform:scale(1.12);
}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{
  position:relative;
  min-height:118px;border-radius:var(--r-lg);
  background:#fff;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px 6px;transition:transform .12s,opacity .2s;
  overflow:hidden;
}
.choice:active{transform:scale(.95)}
.choice .glyph{font-size:clamp(34px,9.6vw,48px);font-weight:900;line-height:1.05}
.choice .emoji{font-size:clamp(40px,11vw,54px);line-height:1.05}
.choice .lbl{font-size:13px;font-weight:900;letter-spacing:-.3px}
.choice .en{font-size:11px;font-weight:800;color:#8B83A8}
.choice.right{background:linear-gradient(150deg,#E6FBEF,#C9F5DA);box-shadow:0 4px 0 #7ED3A8,0 10px 20px rgba(126,211,168,.35)}
.choice.right::after{
  content:"⭕";position:absolute;right:6px;top:4px;font-size:18px;
}
.choice.wrong{animation:wrongShake .45s ease;background:#FFF1F1;box-shadow:0 4px 0 #FFC2C2}
.choice.dim{opacity:.35}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.confetti{position:absolute;pointer-events:none;font-size:16px;animation:confettiFly .95s ease-out forwards;z-index:70}
@keyframes confettiFly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--rot));opacity:0}}

/* ============ 시트(큰 그림/모달) ============ */
.sheet{
  position:fixed;inset:0;z-index:80;display:none;
  place-items:center;padding:16px;
  background:rgba(58,53,80,.45);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.sheet.open{display:grid}
.sheet-card{
  width:100%;max-width:440px;max-height:88dvh;overflow:auto;
  background:linear-gradient(170deg,#fff,#FFFCF4);
  border-radius:var(--r-xl);padding:16px 16px 18px;
  box-shadow:0 22px 50px rgba(50,40,80,.3);
  text-align:center;animation:sheetIn .3s cubic-bezier(.3,1.4,.6,1);
}
@keyframes sheetIn{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet-kicker{
  font-size:11px;font-weight:900;color:#9A8AC6;background:#F2EDFF;
  padding:4px 10px;border-radius:99px;
}
.x{
  margin-left:auto;width:40px;height:40px;border-radius:50%;
  background:#F4F1FA;font-size:17px;display:grid;place-items:center;font-weight:900;color:#6C6485;
}
.sheet-big{
  font-size:clamp(72px,24vw,120px);font-weight:900;line-height:1.02;
  letter-spacing:-3px;color:#3A3550;margin:2px 0 0;
}
.sheet-art{width:min(56vw,220px);margin:0 auto;aspect-ratio:1}
.sheet-art svg{width:100%;height:100%;display:block}
.sheet-emoji{font-size:clamp(60px,20vw,96px);line-height:1.1}
.sheet-word{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.sheet-word .emo{font-size:clamp(28px,8vw,40px)}
.sheet-word .w{font-size:clamp(22px,6.4vw,30px);font-weight:900;letter-spacing:-1px}
.sheet-en{font-size:clamp(18px,5.2vw,24px);font-weight:900;color:#2F6FB0;letter-spacing:-.4px}
.sheet-sub{font-size:13px;font-weight:800;color:var(--ink-soft);margin-top:2px}
.sheet-name{font-size:14px;font-weight:900;color:#8B7FAE;margin-top:2px}
.big-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:60px;margin-top:14px;border-radius:20px;
  background:linear-gradient(160deg,#7FD8A8,#4FB98A);color:#fff;
  font-size:17px;font-weight:900;letter-spacing:-.4px;
  box-shadow:0 5px 0 #3E9C72,0 10px 20px rgba(62,156,114,.28);
}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3E9C72}
.big-btn.alt{background:linear-gradient(160deg,#FFD54F,#FFB43D);color:#6B4500;box-shadow:0 5px 0 #E39A20,0 10px 20px rgba(227,154,32,.25)}
.big-btn.alt:active{box-shadow:0 1px 0 #E39A20}
.big-btn.green-2{background:linear-gradient(160deg,#8CD9FF,#54B6F0);box-shadow:0 5px 0 #3E93C7,0 10px 20px rgba(62,147,199,.25)}
.sheet-row{display:flex;gap:8px}

/* 파트너/웰컴 선택 */
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pick{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:#fff;border-radius:var(--r-lg);padding:10px 8px 12px;
  box-shadow:var(--shadow-s);transition:transform .12s;
  border:3px solid transparent;
}
.pick:active{transform:scale(.95)}
.pick.sel{border-color:#FFC94A;background:linear-gradient(160deg,#FFFDF4,#FFF4D9)}
.pick-art{width:74px;height:74px}
.pick-art svg{width:100%;height:100%;display:block}
.pick .ko{font-size:13px;font-weight:900;letter-spacing:-.4px}
.pick .en{font-size:10.5px;font-weight:800;color:#8B83A8}

/* ============ 보상 연출 ============ */
.layer{
  position:fixed;inset:0;z-index:90;display:none;
  place-items:center;padding:18px;
  background:
    radial-gradient(620px 620px at 50% 42%, #FFFCF2 0%, #FFF3DF 46%, #FFE6F1 74%, #E9F6FF 100%);
}
.layer.open{display:grid}
.reward-inner{position:relative;width:100%;max-width:400px;text-align:center;min-height:340px;display:grid;place-items:center}
.ball{
  position:relative;width:min(52vw,42vh,200px);aspect-ratio:1;border-radius:50%;
  background:#fff;border:10px solid #2f2b3a;overflow:hidden;
  box-shadow:0 16px 34px rgba(60,40,80,.25);
  animation:ballShake 1.05s ease-in-out;
}
@keyframes ballShake{
  0%,100%{transform:rotate(0) translateY(0)}
  12%{transform:rotate(-16deg) translateY(-4px)}
  26%{transform:rotate(13deg) translateY(2px)}
  40%{transform:rotate(-11deg) translateY(-3px)}
  54%{transform:rotate(9deg) translateY(2px)}
  68%{transform:rotate(-6deg) translateY(-2px)}
  82%{transform:rotate(4deg) translateY(1px)}
}
.ball-top{position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(170deg,#FF7A88,#F4485C)}
.ball-band{position:absolute;left:0;right:0;top:calc(50% - 7px);height:14px;background:#F7F7F7;border-top:3px solid #2f2b3a;border-bottom:3px solid #2f2b3a}
.ball-btn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:23%;aspect-ratio:1;border-radius:50%;background:#fff;border:5px solid #2f2b3a;
  display:grid;place-items:center;
}
.ball-btn::after{content:"";width:38%;aspect-ratio:1;border-radius:50%;background:#FFE066;box-shadow:0 0 12px #FFD54F}
.ball.open{animation:ballOpen .62s ease forwards}
@keyframes ballOpen{
  0%{transform:scale(1);filter:brightness(1)}
  40%{transform:scale(1.12);filter:brightness(1.5)}
  100%{transform:scale(.4);opacity:0;filter:brightness(2.4)}
}
.flash{
  position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:50%;
}
.flash.go{animation:flashGo .7s ease-out}
@keyframes flashGo{0%{opacity:0;transform:scale(.2)}25%{opacity:.95;transform:scale(1.3)}100%{opacity:0;transform:scale(2.2)}}
.reward-reveal{display:none;width:100%}
.reward-reveal.show{display:block;animation:revealPop .55s cubic-bezier(.3,1.5,.6,1)}
@keyframes revealPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.reward-kicker{font-size:12px;font-weight:900;color:#B07C2A;background:#FFF0C9;display:inline-block;padding:5px 12px;border-radius:99px}
.reward-art{width:min(44vw,32vh,176px);aspect-ratio:1;margin:8px auto 2px}
.reward-art svg{width:100%;height:100%;display:block}
.reward-name{font-size:clamp(20px,6vw,26px);font-weight:900;letter-spacing:-.6px}
.reward-name small{display:block;font-size:13px;color:#8B83A8;letter-spacing:0;margin-top:1px}
.reward-desc{font-size:12.5px;font-weight:800;color:#7A7391;margin-top:4px}

/* ============ 토스트 ============ */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);
  transform:translate(-50%,20px);z-index:100;
  background:rgba(58,53,80,.94);color:#fff;
  font-size:12.5px;font-weight:800;padding:11px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 하단 ============ */
.foot{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:6px 14px 12px;
}
.reset{
  position:relative;overflow:hidden;
  min-height:34px;padding:0 14px;border-radius:99px;
  background:rgba(255,255,255,.7);color:#9A93AE;
  font-size:10.5px;font-weight:800;letter-spacing:-.2px;
  box-shadow:inset 0 0 0 1.5px #EDE7F5;
}
.reset .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#FFD9E2;transition:width .08s linear}
.reset span{position:relative}
.hint{font-size:10px;font-weight:700;color:#AFA8C0}

/* ============ 쓰기 연습 ============ */
#panel-write{padding-bottom:10px}
.write-top{display:flex;align-items:center;gap:8px;margin:6px 0 6px}
.write-count{
  margin-left:auto;background:#fff;border-radius:999px;padding:8px 13px;
  font-weight:900;font-size:12.5px;box-shadow:var(--shadow-s);white-space:nowrap;
}
.wgroups{display:flex;gap:5px;margin:0 0 7px;overflow-x:auto;scrollbar-width:none}
.wgroups::-webkit-scrollbar{display:none}
.wgroup{
  flex:0 0 auto;min-height:36px;padding:0 13px;border-radius:999px;
  background:#fff;color:var(--ink-soft);font-size:11.5px;font-weight:900;
  letter-spacing:-.3px;box-shadow:var(--shadow-s);white-space:nowrap;
}
.wgroup:active{transform:scale(.94)}
.wgroup.on{color:#fff;background:linear-gradient(160deg,#9FB6FF,#7B90EC);box-shadow:0 3px 0 #6274D6}
.wstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wstrip::-webkit-scrollbar{display:none}
.wchip{
  position:relative;flex:0 0 auto;min-width:46px;height:50px;padding:0 6px;
  border-radius:14px;background:#fff;color:#3A3550;
  display:grid;place-items:center;font-size:19px;font-weight:900;letter-spacing:-.5px;
  box-shadow:var(--shadow-s);transition:transform .12s;
}
.wchip:active{transform:scale(.92)}
.wchip.on{background:linear-gradient(160deg,#FFEBAE,#FFC94A);color:#6B4500;box-shadow:0 3px 0 #E0A72C}
.wchip .tick{position:absolute;right:4px;top:2px;font-size:9px;line-height:1;color:#3FA97C;font-weight:900}
.write-now{display:flex;align-items:baseline;gap:6px;margin:0 3px 5px;min-height:20px}
.write-now .g{font-size:16px;font-weight:900;color:#3A3550}
.write-now .e{font-size:15px;line-height:1}
.write-now .w{font-size:12.5px;font-weight:900;color:#6C6485;letter-spacing:-.3px}
.write-now .n{margin-left:auto;font-size:11px;font-weight:800;color:#A9A2BC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper-wrap{position:relative;max-width:560px;margin:0 auto 9px}
.paper{
  position:relative;width:100%;height:clamp(220px,38vh,360px);
  background:#FFFDF8;border:3px solid #fff;border-radius:var(--r-xl);
  box-shadow:var(--shadow);overflow:hidden;
}
#writeCanvas{
  display:block;width:100%;height:100%;background:#FFFDF8;
  touch-action:none;-ms-touch-action:none;cursor:crosshair;
  -webkit-user-select:none;user-select:none;
}
.write-stamp{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);
  background:rgba(255,255,255,.95);border-radius:22px;padding:11px 20px;
  font-size:18px;font-weight:900;color:#D9821B;letter-spacing:-.5px;
  box-shadow:0 10px 26px rgba(120,90,40,.22);opacity:0;pointer-events:none;
}
.write-stamp.show{animation:stampPop 1.5s cubic-bezier(.3,1.5,.6,1) forwards}
@keyframes stampPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(3deg)}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  82%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}
}
.paper-nav{
  position:absolute;top:50%;width:42px;height:42px;margin-top:-21px;z-index:3;
  border-radius:50%;background:rgba(255,255,255,.94);color:#6C6485;
  display:grid;place-items:center;font-size:14px;font-weight:900;
  box-shadow:var(--shadow-s);
}
.paper-nav.prev{left:7px}
.paper-nav.next{right:7px}
.paper-nav:active{transform:scale(.9)}
.wtools{display:flex;align-items:center;gap:7px;margin:0 0 10px;padding:0 2px}
.swatch{
  flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--c);
  border:3px solid #fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.10),0 2px 6px rgba(80,70,110,.20);
  transition:transform .12s;
}
.swatch:active{transform:scale(.9)}
.swatch.on{outline:3px solid #7FB8FF;outline-offset:2px;transform:scale(1.06)}
.wtools .brush-note{margin-left:auto;font-size:10.5px;font-weight:800;color:#AFA8C0;text-align:right;line-height:1.25}
.wactions{display:flex;gap:8px}
.wactions .big-btn{margin-top:0;width:auto;min-height:58px;font-size:14px;padding:0 6px;letter-spacing:-.6px;white-space:nowrap}
.wactions .listen-sm{flex:0 0 auto;width:46px;background:linear-gradient(160deg,#FFD54F,#FFB43D);color:#6B4500;box-shadow:0 5px 0 #E39A20,0 10px 20px rgba(227,154,32,.22)}
.wactions .listen-sm:active{box-shadow:0 1px 0 #E39A20}
.wactions .clear-btn{flex:0 0 auto;width:72px;background:linear-gradient(160deg,#FFCFDD,#FF9FBA);color:#8A3A56;box-shadow:0 5px 0 #E8759B,0 10px 20px rgba(232,117,155,.22)}
.wactions .clear-btn:active{box-shadow:0 1px 0 #E8759B}
.wactions .demo-btn{flex:0 0 auto;width:88px;padding:0 2px;font-size:13px;background:linear-gradient(160deg,#CFEBFF,#7CC4F2);color:#124E75;box-shadow:0 5px 0 #3E93C7,0 10px 20px rgba(62,147,199,.22)}
.wactions .demo-btn:active{box-shadow:0 1px 0 #3E93C7}
.wactions .demo-btn.playing{background:linear-gradient(160deg,#FFD9E2,#FF9FBA);color:#8A3A56;box-shadow:0 5px 0 #E8759B,0 10px 20px rgba(232,117,155,.22)}
.wactions #wDone{flex:1 1 auto}

/* ============ 반응형 ============ */
@media (max-width:340px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .grid.words{grid-template-columns:1fr 1fr}
  .tabs{gap:3px;padding-left:7px;padding-right:7px}
  .tab{min-width:44px;font-size:9.5px}
  .tab .ti{font-size:14px}
}
@media (min-width:700px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .grid.words{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
  .card{min-height:112px}
}
@media (orientation:landscape) and (max-height:540px){
  .tabs{padding-bottom:7px}
  .tab{min-height:44px;max-width:150px}
  .quiz-top{margin:4px 0 6px;flex-wrap:nowrap}
  .mode{min-height:36px;padding:0 12px}
  .prompt{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 14px;margin-bottom:8px}
  .prompt-text{font-size:14px;letter-spacing:-.4px}
  .prompt-hint{display:none}
  .listen-btn{margin:0 0 0 auto;min-height:44px;padding:0 16px;font-size:14px;flex:0 0 auto}
  .ball-progress{margin:0 0 8px}
  .choices{gap:8px}
  .choice{min-height:74px}
  .choice .emoji{font-size:30px}
  .choice .glyph{font-size:30px}
  .choice .lbl{font-size:12px}
  .topbar{padding:6px 12px 4px}
  .brand{font-size:13px}
  .partner{margin:0 12px 6px;padding:5px 8px}
  .partner-avatar{width:46px;height:46px}
  .partner-avatar svg{width:40px;height:40px}
  .tabs{top:44px;padding-bottom:6px}
  .tab{min-height:42px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
  .card{min-height:78px;padding:5px 3px}
  .card .glyph{font-size:26px}
  .card .emoji{font-size:19px}
  .grid.words{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}
  .wcard{min-height:120px}
  .wcard .emoji{font-size:30px}
  .choice{min-height:88px}
  .choice .emoji{font-size:36px}
  .choice .glyph{font-size:34px}
  .prompt{padding:9px 12px}
  .listen-btn{min-height:44px;margin-top:6px}
  .sheet-big{font-size:64px}
  .dex-art{max-height:64px}
  .sheet-card{max-height:94dvh}
  .paper{height:clamp(176px,52vh,264px)}
  .write-top{margin:4px 0 6px}
  .wgroups{margin-bottom:5px}
  .wchip{min-width:40px;height:44px;font-size:17px}
  .write-now{margin-bottom:5px}
  .wtools{margin-bottom:7px}
  .wactions .big-btn{min-height:50px;font-size:14px}
}
@media (max-width:360px){
  .wactions .big-btn{font-size:12.5px;padding:0 4px;letter-spacing:-.7px}
  .wactions .listen-sm{width:42px}
  .wactions .demo-btn{width:76px;font-size:11.5px}
  .wactions .clear-btn{width:62px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand"><span class="brand-ball" aria-hidden="true"></span><span>포켓몬 한글·영어 놀이</span></div>
    <div class="stats">
      <div class="star-chip" id="starChip" title="모은 별"><span class="s" aria-hidden="true">⭐</span><span id="starCount">0</span></div>
      <button class="round-btn" id="muteBtn" aria-label="소리 끄기" aria-pressed="false">🔊</button>
    </div>
  </header>

  <section class="partner" aria-label="파트너 포켓몬">
    <div class="partner-avatar" id="partnerAvatar" aria-hidden="true"></div>
    <div class="partner-copy">
      <div class="partner-name" id="partnerName">포켓몬 친구</div>
      <div class="bubble" id="partnerBubble" aria-live="polite">안녕! 같이 놀자!</div>
    </div>
    <button class="ghost-btn" id="partnerBtn">파트너</button>
  </section>

  <nav class="tabs" role="tablist" aria-label="놀이 고르기">
    <button class="tab" role="tab" id="tab-ko" data-tab="ko" aria-selected="true" aria-controls="panel-ko"><span class="ti" aria-hidden="true">🇰🇷</span><span>한글</span></button>
    <button class="tab" role="tab" id="tab-en" data-tab="en" aria-selected="false" aria-controls="panel-en"><span class="ti" aria-hidden="true">🇺🇸</span><span>영어</span></button>
    <button class="tab" role="tab" id="tab-words" data-tab="words" aria-selected="false" aria-controls="panel-words"><span class="ti" aria-hidden="true">🎨</span><span>낱말</span></button>

  /* ---------- 5. 저장소 · 사운드 · 음성 ---------- */
  var STORAGE_KEY = 'kidsPlay.pokemon.v1';
  var Store = {
    get: function (k, d) {

      } catch (e) { return d; }

    writeIndex: 0,
    writeColor: 0
  };

  function loadState() {
    var saved = Store.get(STORAGE_KEY, null);
    if (saved && typeof saved === 'object') {
      if (typeof saved.stars === 'number' && isFinite(saved.stars) && saved.stars >= 0) state.stars = Math.floor(saved.stars);
      if (Object.prototype.toString.call(saved.caught) === '[object Array]') {
        state.caught = saved.caught.filter(function (id) { return !!pokeById(id); });
      }
      if (typeof saved.partner === 'string' && pokeById(saved.partner)) state.partner = saved.partner;
      if (typeof saved.muted === 'boolean') state.muted = saved.muted;
      if (saved.quizMode === 'en' || saved.quizMode === 'ko') state.quizMode = saved.quizMode;
      if (Object.prototype.toString.call(saved.wrote) === '[object Array]') {
        state.wrote = saved.wrote.filter(function (k) { return typeof k === 'string' && k.length < 40; }).slice(0, 200);
      }
      if (saved.writeLang === 'en' || saved.writeLang === 'ko') state.writeLang = saved.writeLang;
      if (saved.writeGroup === 'consonant' || saved.writeGroup === 'vowel' || saved.writeGroup === 'syllable'
          || saved.writeGroup === 'upper' || saved.writeGroup === 'lower') state.writeGroup = saved.writeGroup;
      if (typeof saved.writeIndex === 'number' && isFinite(saved.writeIndex) && saved.writeIndex >= 0) {
        state.writeIndex = Math.floor(saved.writeIndex);
      }
      if (typeof saved.writeColor === 'number' && isFinite(saved.writeColor)) {
        state.writeColor = Math.max(0, Math.min(WRITE_COLORS.length - 1, Math.floor(saved.writeColor)));
      }
    }
    if (state.partner && state.caught.indexOf(state.partner) === -1) state.caught.push(state.partner);
  }

  /* --- Web Audio 효과음 --- */
  var Sfx = {
    ctx: null,
    ensure: function () {
      try {
        if (!this.ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended' && this.ctx.resume) {
          var p = this.ctx.resume();
          if (p && p.catch) p.catch(function () {});
        }
        return this.ctx;
      } catch (e) { return null; }
    },
    tone: function (freq, startAt, dur, type, vol) {
      var ctx = this.ensure();
      if (!ctx) return;
      try {
        var t0 = ctx.currentTime + startAt;
        var osc = ctx.createOscillator();
        var g = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.03);
      } catch (e) { /* 소리 실패는 조용히 넘어감 */ }
    },
    click: function () { if (state.muted) return; this.tone(720, 0, 0.09, 'triangle', 0.10); },
    pop: function () { if (state.muted) return; this.tone(880, 0, 0.10, 'sine', 0.13); this.tone(1320, 0.05, 0.10, 'sine', 0.08); },
    correct: function () {
      if (state.muted) return;
      this.tone(784, 0, 0.14, 'sine', 0.18);
      this.tone(988, 0.13, 0.14, 'sine', 0.17);
      this.tone(1319, 0.26, 0.30, 'sine', 0.16);
      this.tone(1568, 0.30, 0.26, 'triangle', 0.07);
    },
    wrong: function () {
      if (state.muted) return;
      this.tone(392, 0, 0.16, 'sine', 0.14);
      this.tone(311, 0.14, 0.22, 'sine', 0.13);
    },
    star: function () {
      if (state.muted) return;
      this.tone(1047, 0, 0.10, 'triangle', 0.10);
      this.tone(1319, 0.08, 0.12, 'triangle', 0.09);
    },
    ball: function () {
      if (state.muted) return;
      var notes = [523, 659, 784, 1047, 1319];
      for (var i = 0; i < notes.length; i++) this.tone(notes[i], i * 0.11, 0.22, 'triangle', 0.12);
    }

  /* --- 음성 합성 --- */
  var Speech = {
    supported: !!(window.speechSynthesis && window.SpeechSynthesisUtterance),
    voices: [],
    token: 0,
    init: function () {
      if (!this.supported) return;
      var self = this;
      var read = function () { try { self.voices = window.speechSynthesis.getVoices() || []; } catch (e) { self.voices = []; } };
      read();
      try { window.speechSynthesis.addEventListener('voiceschanged', read); }
      catch (e) { try { window.speechSynthesis.onvoiceschanged = read; } catch (e2) {} }
    },
    voiceFor: function (lang) {
      var list = this.voices || [];
      if (!list.length) { try { list = window.speechSynthesis.getVoices() || []; } catch (e) { list = []; } }
      var want = lang.toLowerCase();
      var exact = null, loose = null;
      for (var i = 0; i < list.length; i++) {
        var v = list[i];
        var vl = (v.lang || '').toLowerCase().replace('_', '-');
        if (vl === want) { exact = v; break; }
        if (!loose && vl.indexOf(want.split('-')[0]) === 0) loose = v;
      }
      return exact || loose || null;
    },
    say: function (text, lang, opts) {
      if (!text) return;
      if (!this.supported) return;
      if (state.muted) return;
      opts = opts || {};
      var self = this;
      var myToken = ++this.token;
      try { window.speechSynthesis.cancel(); } catch (e) {}
      var run = function () {
        if (myToken !== self.token) return;
        try {
          var u = new window.SpeechSynthesisUtterance(String(text));
          u.lang = lang;
          u.rate = opts.rate || 0.88;
          u.pitch = opts.pitch || 1.08;
          u.volume = 1;
          var v = self.voiceFor(lang);
          if (v) { try { u.voice = v; } catch (e) { /* 음성 객체가 맞지 않으면 기본 음성으로 */ } }
          try { window.speechSynthesis.speak(u); } catch (e) {}
        } catch (e) { /* 음성 미지원/차단 시 조용히 무시 */ }
      };
      // iOS는 사용자 제스처 안에서 첫 발화가 이뤄져야 하므로, 재생 중일 때만 잠깐 기다린다.
      var busy = false;
      try { busy = !!(window.speechSynthesis.speaking || window.speechSynthesis.pending); } catch (e) {}
      if (busy) {
        try { window.setTimeout(run, 60); } catch (e) { run(); }
      } else {
        run();
      }
    },
    sayKo: function (text, opts) { this.say(text, 'ko-KR', opts); },
    sayEn: function (text, opts) { this.say(text, 'en-US', Object.assign({ rate: 0.85 }, opts || {})); },
    stop: function () {

    }

  var $ = function (sel, root) { return (root || document).querySelector(sel); };

  function esc(s) {

    });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pickSome(arr, n, exclude) {
    var pool = arr.filter(function (x) { return exclude.every(function (e) { return !sameItem(e, x); }); });
    return shuffle(pool).slice(0, n);
  }
  function sameItem(a, b) { return a && b && a.key === b.key; }

  function confetti(anchor) {
    var glyphs = ['⭐', '✨', '🎉', '💛', '💫', '🌟'];
    var box = { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
    try {
      if (anchor && anchor.getBoundingClientRect) {
        var r = anchor.getBoundingClientRect();
        if (r.width || r.height) box = r;
      }
    } catch (e) {}
    for (var i = 0; i < 10; i++) {
      (function (i) {
        var s = document.createElement('span');
        s.className = 'confetti';
        s.setAttribute('aria-hidden', 'true');
        s.textContent = rand(glyphs);
        s.style.position = 'fixed';
        s.style.left = (box.left + box.width / 2) + 'px';
        s.style.top = (box.top + box.height / 2) + 'px';
        s.style.setProperty('--dx', (Math.random() * 170 - 85).toFixed(0) + 'px');
        s.style.setProperty('--dy', (-55 - Math.random() * 100).toFixed(0) + 'px');
        s.style.setProperty('--rot', (Math.random() * 200 - 100).toFixed(0) + 'deg');

      var el = document.getElementById('ballProgress');
      if (el) {
        var mod = state.stars % 5;
        var html = '<span style="font-size:15px">⚪</span>';
        for (var i = 0; i < 5; i++) {
          html += '<span class="dot' + (i < mod ? ' on' : '') + '"></span>';
        }
        html += '<span>다음 친구까지 ' + (5 - mod) + '별</span>';
        el.innerHTML = html;
      }
      var sc = document.getElementById('quizScore');
      if (sc) sc.textContent = '⭐ ' + state.stars;
    },

    make: function () {
      var mode = this.mode;
      var kind = Math.random() < 0.35 ? 'letter' : 'word';
      if (kind === 'letter') {
        var pool = [];
        if (mode === 'ko') {
          KO_CONSONANTS.forEach(function (o, i) { pool.push({ key: 'kc' + i, glyph: o.c, speak: o.name }); });
          KO_VOWELS.forEach(function (o, i) { pool.push({ key: 'kv' + i, glyph: o.c, speak: o.name }); });
          KO_SYLLABLES.forEach(function (o, i) { pool.push({ key: 'ks' + i, glyph: o.c, speak: o.name }); });
        } else {
          EN_LETTERS.forEach(function (o, i) { pool.push({ key: 'el' + i, glyph: o.c + ' ' + o.c.toLowerCase(), speak: o.c }); });
        }
        var ansL = rand(pool);
        var csL = shuffle([ansL].concat(pickSome(pool, 3, [ansL])));
        return {
          kind: 'letter', mode: mode, answer: ansL, choices: csL,
          prompt: mode === 'ko' ? '이 글자를 찾아보세요!' : 'Find the letter!',
          hint: mode === 'ko' ? '소리를 듣고 글자를 눌러요' : '영어 소리를 듣고 글자를 골라요'
        };
      }
      var words = ALL_WORDS.map(function (w, i) {
        return { key: 'w' + i, ko: w.ko, en: w.en, emoji: w.emoji };
      });
      var ans = rand(words);
      var cs = shuffle([ans].concat(pickSome(words, 3, [ans])));
      return {
        kind: 'word', mode: mode, answer: ans, choices: cs,
        prompt: mode === 'ko' ? '무슨 낱말일까요?' : 'Which word is it?',
        hint: '소리를 듣고 그림을 골라요'
      };
    },

    next: function () {
      var self = this;
      this.locked = false;
      this.q = this.make();
      var q = this.q;
      var pt = document.getElementById('promptText');
      var ph = document.getElementById('promptHint');
      if (pt) pt.textContent = q.prompt;
      if (ph) ph.textContent = '🔊 ' + q.hint;
      var box = document.getElementById('choices');
      if (box) {
        var html = '';
        q.choices.forEach(function (c) {
          if (q.kind === 'letter') {
            html += '<button class="choice" data-key="' + c.key + '" aria-label="' + esc(c.speak) + '">'
              + '<span class="glyph">' + esc(c.glyph) + '</span></button>';
          } else {
            html += '<button class="choice" data-key="' + c.key + '" aria-label="' + esc(q.mode === 'ko' ? c.ko : c.en) + '">'
              + '<span class="emoji" aria-hidden="true">' + c.emoji + '</span>'
              + '<span class="lbl">' + esc(q.mode === 'ko' ? c.ko : c.en) + '</span></button>';
          }
        });
        box.innerHTML = html;
      }
      this.updateProgress();
      setTimeout(function () { self.speakQuestion(); }, 260);
    },

    speakQuestion: function () {
      var q = this.q;
      if (!q) return;
      var btn = document.getElementById('replayBtn');
      if (btn) {
        btn.classList.remove('playing');
        void btn.offsetWidth;
        btn.classList.add('playing');
        setTimeout(function () { btn.classList.remove('playing'); }, 1000);
      }
      if (q.mode === 'ko') {
        if (q.kind === 'letter') Speech.sayKo(q.answer.speak + '. ' + q.answer.speak, { rate: 0.85 });
        else Speech.sayKo(q.answer.ko + ', ' + q.answer.ko, { rate: 0.85 });
      } else {
        if (q.kind === 'letter') Speech.sayEn(q.answer.speak, { rate: 0.85 });
        else Speech.sayEn(q.answer.en, { rate: 0.85 });
      }
    },

    answer: function (btn) {
      if (this.locked || !this.q) return;
      var key = btn.getAttribute('data-key');
      if (key === this.q.answer.key) {
        this.locked = true;
        btn.classList.add('right');
        Sfx.correct();

  /* ---------- 13-c. 획순(필순) 데이터 ----------
     각 글자의 획은 0~1 정규화 상자 안의 점 목록([x, y]) 배열이다. (x: 왼→오, y: 위→아래)
     한글은 정사각 상자, 영어 대문자는 (0 = 윗선, 1 = 밑줄),
     영어 소문자는 (0 = 오름선, 0.30 = 작은글자 윗선, 0.80 = 밑줄, 1 = 내림선) 기준. */
  var HINT_COLOR = '#2F86C8';

  function sArc(cx, cy, rx, ry, a0, a1, n) {
    var out = [], i, t;
    n = n || 12;
    for (i = 0; i <= n; i++) {
      t = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
      out.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]);
    }
    return out;
  }
  function sJoin() {
    var out = [], i, j;
    for (i = 0; i < arguments.length; i++) {
      for (j = 0; j < arguments[i].length; j++) out.push(arguments[i][j]);
    }
    return out;
  }
  // 자모의 획을 글자 칸 안의 작은 상자로 옮긴다.
  function sPlace(strokes, box) {
    var out = [], i, j, s, p;
    for (i = 0; i < strokes.length; i++) {
      s = [];
      for (j = 0; j < strokes[i].length; j++) {
        p = strokes[i][j];
        s.push([box[0] + p[0] * box[2], box[1] + p[1] * box[3]]);
      }
      out.push(s);
    }
    return out;
  }

    badgeSpot: function (x, y, dx, dy, r, placed, all, self) {

    paintHints: function () {

        ctx.fill();

        ctx.stroke();

        var p1 = this.pointAlong(s, Math.min(0.97, f + 0.07));
        if (!p0 || !p1) continue;
        var vx = p1.x - p0.x, vy = p1.y - p0.y, vl = Math.sqrt(vx * vx + vy * vy);

      }
    },

    /* --- 획순 시범 재생 --- */

    toggleDemo: function () {

    playDemo: function () {

      this.updateDemoBtn();

            if (!self.demo) return;
            self.demoRaf = raf(step);
          }, 170);
          return;
        }
        self.demoRaf = raf(step);
      };
      this.demoRaf = raf(step);
    },

    paintDemoStroke: function (st, frac) {
      var ctx = this.ctx, g = this.geom;
      if (!ctx || !g) return;
      var pts = this.partialPoints(st, frac);
      if (!pts.length) return;
      ctx.save();
      ctx.strokeStyle = DEMO_COLOR;
      ctx.fillStyle = DEMO_COLOR;
      ctx.lineWidth = Math.max(7, g.scale * 0.072);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

        ctx.arc(pts[0].x, pts[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);

    },

    finishDemo: function () {

      this.demo.done = true;
      this.updateDemoBtn();
      this.demoTimer = setTimeout(function () {

    paintStroke: function (st) {
      var ctx = this.ctx;

      var pts = st.points;
      ctx.save();
      ctx.strokeStyle = st.color;
      ctx.fillStyle = st.color;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.lineWidth = st.width;
      if (pts.length === 1) {
        ctx.beginPath();
        ctx.arc(pts[0].x, pts[0].y, st.width / 2, 0, Math.PI * 2);

        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);

      }
      ctx.restore();
    },

    repaint: function () {

    paintTail: function (st) {

      if (n < 2) return;
      ctx.save();
      ctx.strokeStyle = st.color;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.lineWidth = st.width;
      ctx.beginPath();
      if (n === 2) {
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
      } else {
        var a = pts[n - 3], b = pts[n - 2], c = pts[n - 1];
        ctx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2);
        ctx.quadraticCurveTo(b.x, b.y, (b.x + c.x) / 2, (b.y + c.y) / 2);
      }
      ctx.stroke();
      ctx.restore();
    },

    clearInk: function () {
      if (this.demo) this.stopDemo(false);
      this.strokes = [];
      this.drawn = false;
      this.repaint();
    },

    /* --- 입력 --- */
    pos: function (e) {
      var r = this.rect;
      if (!r) {
        r = this.canvas ? this.canvas.getBoundingClientRect() : { left: 0, top: 0 };
        this.rect = r;
      }
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    },

    bindCanvas: function () {
      var cv = this.canvas, self = this;
      if (!cv) return;
      cv.addEventListener('pointerdown', function (e) { self.down(e); });
      cv.addEventListener('pointermove', function (e) { self.move(e); });
      cv.addEventListener('pointerup', function (e) { self.up(e); });
      cv.addEventListener('pointercancel', function (e) { self.up(e); });
      cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      cv.addEventListener('dblclick', function (e) { e.preventDefault(); });
    },

    down: function (e) {
      if (!this.ctx) return;
      if (this.pointerId !== null) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (this.demo) this.stopDemo();   // 시범을 멈추고 바로 따라 쓸 수 있게
      try { e.preventDefault(); } catch (err) {}
      this.pointerId = e.pointerId;
      this.rect = this.canvas.getBoundingClientRect();
      try { this.canvas.setPointerCapture(e.pointerId); } catch (err) {}
      Speech.stop();
      var p = this.pos(e);
      var lw = Math.max(12, Math.min(26, Math.min(this.w, this.h) * 0.062));
      var st = {
        color: WRITE_COLORS[this.color] || WRITE_COLORS[0],
        width: lw,
        points: [p]
      };
      this.strokes.push(st);
      this.drawn = true;
      var ctx = this.ctx;
      ctx.save();
      ctx.fillStyle = st.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, lw / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    },

    move: function (e) {
      if (this.pointerId === null || e.pointerId !== this.pointerId) return;
      var st = this.strokes[this.strokes.length - 1];
      if (!st) return;
      try { e.preventDefault(); } catch (err) {}
      var evs = null;
      try { if (typeof e.getCoalescedEvents === 'function') evs = e.getCoalescedEvents(); } catch (err) { evs = null; }
      var list = (evs && evs.length) ? evs : [e];
      for (var i = 0; i < list.length; i++) {
        var p = this.pos(list[i]);
        var last = st.points[st.points.length - 1];
        if (last && Math.abs(p.x - last.x) < 0.6 && Math.abs(p.y - last.y) < 0.6) continue;
        st.points.push(p);
        this.paintTail(st);
      }
    },

    up: function (e) {
      if (this.pointerId === null) return;
      if (e && e.pointerId !== undefined && e.pointerId !== this.pointerId) return;
      try {
        if (this.canvas && this.canvas.hasPointerCapture && this.canvas.hasPointerCapture(this.pointerId)) {
          this.canvas.releasePointerCapture(this.pointerId);
        }
      } catch (err) {}
      this.pointerId = null;
      this.rect = null;
    },

    /* --- 완료 보상 --- */
    showStamp: function () {
      var el = document.getElementById('writeStamp');
      if (!el) return;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
      if (this.stampTimer) clearTimeout(this.stampTimer);
      this.stampTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
    },

    complete: function () {
      var it = this.item();
      if (!it) return;
      if (!this.drawn) {
        Sfx.click();
        partnerSay('먼저 글자를 손가락으로 써 봐!', 'sad');
        toast('글자를 먼저 따라 써 보세요 ✍️');
        return;
      }
      this.drawn = false;
      var key = this.key();
      var isNew = state.wrote.indexOf(key) === -1;
      if (isNew) {
        state.wrote.push(key);
        saveState();
      }
      Sfx.correct();
      confetti(this.canvas);
      vibrate(25);
      var p = partner();
      var lines = isNew
        ? ['{cry} 글자를 잘 썼어!', '{cry} 멋진 글씨야!', '{cry} 따라 쓰기 성공!']
        : ['{cry} 또 잘 썼네!', '{cry} 최고야!', '{cry} 글씨가 예뻐!'];
      partnerSay(rand(lines).replace('{cry}', p.cry), 'happy', '✍️ 다음 글자도 써 볼까?');
      Speech.sayKo(rand(['잘 썼어요!', '멋져요!', '참 잘했어요!']), { rate: 0.9 });
      this.showStamp();
      this.renderChrome();
      addStar();
    },

    /* --- 이벤트 위임 --- */
    onClick: function (e) {
      var t = e.target;
      var hit = function (sel) { return t.closest ? t.closest(sel) : null; };
      var langBtn = hit('[data-wlang]');
      if (langBtn) { this.setLang(langBtn.getAttribute('data-wlang')); return; }
      var gBtn = hit('[data-wgroup]');
      if (gBtn) { this.setGroup(gBtn.getAttribute('data-wgroup')); return; }
      var chip = hit('[data-wi]');
      if (chip) { this.select(chip.getAttribute('data-wi')); return; }
      var sw = hit('[data-color]');
      if (sw) { this.setColor(sw.getAttribute('data-color')); return; }
      if (hit('#wPrev')) { this.step(-1); return; }
      if (hit('#wNext')) { this.step(1); return; }
      if (hit('#wSpeak')) { this.speak(false); return; }
      if (hit('#wClear')) {
        this.clearInk();
        Sfx.click();
        vibrate(8);
        toast('다시 쓸 수 있어요');
        return;
      }
      if (hit('#wDemo')) { this.toggleDemo(); return; }
      if (hit('#wDone')) { this.complete(); return; }
    }
  };

  function openWriting(lang, group, index) {
    Write.goto(lang, group, index);
    setTab('write');
    setTimeout(function () { if (Write.started) Write.resize(true); }, 60);
    if (Write.item()) partnerSay('✍️ 이번엔 ' + Write.glyph() + ' 글자를 써 볼까?', 'happy', '✍️ 글자를 따라 써 볼까?');
  }

  /* ---------- 14. 파트너 · 첫 시작 ---------- */
  function pickHtml(p) {
    return '<button class="pick" data-partner="' + p.id + '" aria-label="' + esc(p.ko + ' ' + p.en) + '">'
      + '<div class="pick-art">' + p.svg + '</div>'
      + '<div class="ko">' + esc(p.ko) + '</div>'
      + '<div class="en">' + esc(p.en) + '</div>'
      + '</button>';
  }

  function fillPartnerChoices() {
    var html = PARTNER_IDS.map(function (id) { return pickHtml(pokeById(id)); }).join('');
    if (dom.welcomeChoices) dom.welcomeChoices.innerHTML = html;
    if (dom.pickerChoices) dom.pickerChoices.innerHTML = html;
  }

  function choosePartner(id) {
    var p = pokeById(id);
    if (!p) return;
    state.partner = id;
    if (state.caught.indexOf(id) === -1) state.caught.push(id);
    saveState();
    renderPartner();
    renderDex();
    dom.welcome.classList.remove('open');
    dom.picker.classList.remove('open');
    bodyLock(false);
    Sfx.pop();
    partnerSay(p.cry + ' 같이 놀자!', 'happy');
    Speech.sayKo(p.ko + '! ' + p.en, { rate: 0.85 });
    toast(p.ko + '가 내 파트너가 되었어요!');
    updateHeader();
  }

  function openWelcome() {
    fillPartnerChoices();
    dom.welcome.classList.add('open');
    bodyLock(true);
    Sfx.pop();
  }

  function openPicker() {
    fillPartnerChoices();
    dom.picker.classList.add('open');
    bodyLock(true);
    Sfx.click();
  }

  /* ---------- 15. 초기화(길게 누르기) ---------- */
  var holdTimer = null, holdStart = 0;
  function beginHold(e) {
    if (e) { try { e.preventDefault(); } catch (err) {} }
    if (holdTimer) return;
    holdStart = Date.now();
    if (dom.resetFill) dom.resetFill.style.width = '0%';
    holdTimer = setInterval(function () {
      var pct = Math.min(100, ((Date.now() - holdStart) / 1200) * 100);
      if (dom.resetFill) dom.resetFill.style.width = pct + '%';
      if (pct >= 100) {
        endHold();
        doReset();
      }
    }, 55);
  }
  function endHold() {
    if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
    if (dom.resetFill) { dom.resetFill.style.width = '0%'; }
  }
  function doReset() {
    var partnerId = state.partner;
    var ok = true;
    try { ok = window.confirm('모은 별, 포켓몬 도감, 써 본 글자를 처음으로 되돌릴까요?'); } catch (e) { ok = false; }
    if (!ok) { toast('그대로 두었어요'); return; }
    state.stars = 0;
    state.caught = partnerId ? [partnerId] : [];
    state.wrote = [];
    saveState();
    updateHeader();
    renderDex();
    if (Quiz.started) { Quiz.updateProgress(); Quiz.next(); }
    if (Write.started) { Write.clearInk(); Write.renderChrome(); }
    Sfx.pop();
    toast('별·도감·글씨를 처음으로 되돌렸어요');
  }

  /* ---------- 16. 이벤트 연결 ---------- */
  function wireEvents() {
    var koPanel = document.getElementById('panel-ko');
    if (koPanel) koPanel.addEventListener('click', function (e) {
      var card = e.target.closest ? e.target.closest('.card') : null;
      if (!card) return;
      Sfx.click();
      openLetter(card.getAttribute('data-l'), parseInt(card.getAttribute('data-i'), 10));
    });

    var enPanel = document.getElementById('panel-en');
    if (enPanel) enPanel.addEventListener('click', function (e) {
      var card = e.target.closest ? e.target.closest('.card') : null;
      if (!card) return;
      Sfx.click();
      openLetter('en', parseInt(card.getAttribute('data-i'), 10));
    });

    var wordsPanel = document.getElementById('panel-words');
    if (wordsPanel) wordsPanel.addEventListener('click', function (e) {
      var main = e.target.closest ? e.target.closest('.wcard-main') : null;
      if (main) { openWord(main.getAttribute('data-w')); return; }
      var say = e.target.closest ? e.target.closest('.mini') : null;
      if (say) {
        var w = getWord(say.getAttribute('data-w'));
        if (!w) return;
        Sfx.pop();
        if (say.getAttribute('data-say') === 'en') Speech.sayEn(w.en + '. ' + w.en, { rate: 0.86 });
        else Speech.sayKo(w.ko + '. ' + w.ko, { rate: 0.85 });
        vibrate(10);
      }
    });

    var dexPanel = document.getElementById('panel-dex');
    if (dexPanel) dexPanel.addEventListener('click', function (e) {
      var cardEl = e.target.closest ? e.target.closest('.dex-card[data-poke]') : null;
      if (!cardEl) return;
      Sfx.click();
      openPoke(cardEl.getAttribute('data-poke'));
    });

    var writePanel = document.getElementById('panel-write');
    if (writePanel) writePanel.addEventListener('click', function (e) { Write.onClick(e); });

    var tabs = document.querySelector('.tabs');
    if (tabs) tabs.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.tab') : null;
      if (!t) return;
      Sfx.click();
      setTab(t.getAttribute('data-tab'));
    });

    if (dom.muteBtn) dom.muteBtn.addEventListener('click', function () {
      state.muted = !state.muted;
      saveState();
      updateHeader();
      if (state.muted) {
        Speech.stop();
        toast('소리를 껐어요');
      } else {
        Sfx.pop();
        toast('소리를 켰어요');
      }
    });

    if (dom.partnerBtn) dom.partnerBtn.addEventListener('click', openPicker);
    if (dom.pickerClose) dom.pickerClose.addEventListener('click', function () {
      dom.picker.classList.remove('open');
      bodyLock(false);
    });

    if (dom.picker) dom.picker.addEventListener('click', function (e) {
      var pick = e.target.closest ? e.target.closest('[data-partner]') : null;
      if (pick) { choosePartner(pick.getAttribute('data-partner')); return; }
      if (e.target === dom.picker) { dom.picker.classList.remove('open'); bodyLock(false); }
    });

    if (dom.welcome) dom.welcome.addEventListener('click', function (e) {
      var pick = e.target.closest ? e.target.closest('[data-partner]') : null;
      if (pick) choosePartner(pick.getAttribute('data-partner'));
    });

    if (dom.sheet) dom.sheet.addEventListener('click', function (e) {
      if (e.target === dom.sheet || (e.target.closest && e.target.closest('[data-close]'))) closeSheet();
    });

    if (dom.rewardOk) dom.rewardOk.addEventListener('click', closeReward);
    if (dom.rewardLayer) dom.rewardLayer.addEventListener('click', function (e) {
      if (e.target === dom.rewardLayer && dom.rewardReveal.classList.contains('show')) closeReward();
    });

    if (dom.resetBtn) {
      dom.resetBtn.addEventListener('pointerdown', beginHold);
      dom.resetBtn.addEventListener('pointerup', endHold);
      dom.resetBtn.addEventListener('pointercancel', endHold);
      dom.resetBtn.addEventListener('pointerleave', endHold);
      dom.resetBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    }

    document.addEventListener('pointerup', function (e) { Write.up(e); });

    var onResize = function () { if (Write.started) Write.resize(true); };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', function () { setTimeout(onResize, 250); });
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(function () { if (Write.started) Write.repaint(); });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (dom.sheet.classList.contains('open')) closeSheet();
        else if (dom.picker.classList.contains('open')) { dom.picker.classList.remove('open'); bodyLock(false); }
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) Speech.stop();
    });

    // 첫 터치에서 오디오 컨텍스트 잠금 해제(iOS/Android)
    var unlock = function () {
      Sfx.ensure();
      document.removeEventListener('pointerdown', unlock, true);
      document.removeEventListener('touchstart', unlock, true);
    };
    document.addEventListener('pointerdown', unlock, true);
    document.addEventListener('touchstart', unlock, true);
  }

  /* ---------- 17. 시작 ---------- */
  function init() {
    cacheDom();
    loadState();
    applyExamples();
    Speech.init();
    updateHeader();
    renderPartner();
    renderKo();
    renderEn();
    renderWords();
    renderDex();
    fillPartnerChoices();
    wireEvents();
    if (!state.partner) {
      openWelcome();
    } else {
      partnerSay('안녕! 같이 놀자!', 'happy');
    }
  }

  // 화면에는 보이지 않는 테스트용 연결고리
  window.kidsApp = { Write: Write, examples: LETTER_EXAMPLES };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
