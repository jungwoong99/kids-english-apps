<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FFF4DD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="포켓몬 놀이">
<title>포켓몬 놀이 · 화상영어 &amp; 한글·영어</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%232b2b2b' stroke-width='6'/%3E%3Cpath d='M4 50h92' stroke='%232b2b2b' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='13' fill='%23fff' stroke='%232b2b2b' stroke-width='6'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #ffe6a7 0, rgba(255,230,167,0) 42%),
      radial-gradient(circle at 88% 4%, #cfe8ff 0, rgba(207,232,255,0) 40%),
      radial-gradient(circle at 50% 100%, #ffd9e6 0, rgba(255,217,230,0) 55%),
      #fffaf0;
    color:#3b3355;
    padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 26px);
    display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;
  }
  .wrap{width:100%;max-width:460px;margin:auto 0}
  header{text-align:center;margin-bottom:22px}
  .ball{
    width:74px;height:74px;margin:0 auto 12px;border-radius:50%;
    background:linear-gradient(#ff5f7a 0 49%,#2b2b2b 49% 52%,#ffffff 52% 100%);
    border:4px solid #2b2b2b;position:relative;
    box-shadow:0 10px 24px rgba(255,95,122,.28);
    animation:bob 2.6s ease-in-out infinite;
  }
  .ball::after{
    content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;
    border-radius:50%;background:#fff;border:4px solid #2b2b2b;
  }
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.4px}
  header p{margin:0;font-size:13.5px;color:#8b81a8;font-weight:600}

  .card{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:#fff;border-radius:22px;padding:16px;
    border:2px solid #ffe9c2;
    box-shadow:0 12px 26px rgba(94,74,150,.10);
    margin-bottom:14px;
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .card:active{transform:scale(.977);box-shadow:0 6px 14px rgba(94,74,150,.14)}
  .card .thumb{
    flex:0 0 auto;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;
  }
  .card.call .thumb{background:linear-gradient(150deg,#ffe0e7,#ffc2d4)}
  .card.learn .thumb{background:linear-gradient(150deg,#fff1cc,#ffe08a)}
  .card .body{flex:1 1 auto;min-width:0}
  .card h2{margin:0 0 4px;font-size:17px;letter-spacing:-.3px}
  .card .desc{margin:0;font-size:12.5px;line-height:1.45;color:#8b81a8;font-weight:600}
  .card .tag{
    display:inline-block;margin-top:7px;padding:3px 9px;border-radius:999px;
    font-size:10.5px;font-weight:800;letter-spacing:.2px;
    background:#f2eeff;color:#7a5bc4;
  }
  .card.call .tag{background:#ffe9ef;color:#e0507b}
  .card .go{flex:0 0 auto;font-size:17px;color:#c8c1e0;font-weight:900}

  .note{
    margin-top:18px;background:#fff8e7;border:1.5px dashed #ffdd9e;border-radius:16px;
    padding:12px 14px;font-size:12px;line-height:1.6;color:#94794a;font-weight:650;
  }
  .note b{color:#7a5f2c}
  footer{margin-top:18px;text-align:center;font-size:11px;color:#b0a8c6;font-weight:600}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){.ball{animation:none}}
  @media (max-height:620px){header{margin-bottom:14px}.ball{width:56px;height:56px;margin-bottom:8px}h1{font-size:19px}.card{padding:13px;margin-bottom:11px}.card .thumb{width:52px;height:52px;font-size:26px}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="ball" aria-hidden="true"></div>
      <h1>포켓몬 놀이</h1>
      <p>오늘은 어떤 놀이를 할까요?</p>
    </header>

    <a class="card call" href="./video-call.html">
      <span class="thumb" aria-hidden="true">🎧</span>
      <span class="body">
        <h2>포켓몬 화상영어</h2>
        <p class="desc">포켓몬 친구와 마이크로 영어 수다떨기</p>
        <span class="tag">마이크 사용</span>
      </span>
      <span class="go" aria-hidden="true">›</span>
    </a>

    <a class="card learn" href="./learning.html">
      <span class="thumb" aria-hidden="true">📚</span>
      <span class="body">
        <h2>포켓몬 한글·영어 학습</h2>
        <p class="desc">한글 낱말과 영어 알파벳 놀이</p>
        <span class="tag">퀴즈 · 게임</span>
      </span>
      <span class="go" aria-hidden="true">›</span>
    </a>

    <div class="note">
      <b>화상영어 처음 열 때</b><br>
      크롬이 “마이크를 사용하도록 허용할까요?”라고 물으면 <b>허용</b>을 눌러 주세요. 한 번 허용하면 다음부터는 그냥 열립니다.
    </div>

    <footer>https://jungwoong99.github.io/kids-english-apps/</footer>
  </div>
</body>
</html>
